# A full-season run: everything above elo 10, the whole published season.
name = "season53"
seed = 20260903
output_dir = "runs"

[data]
season  = "season53"
repo_id = "EliF77/brawlstars-ranked"
elo_min = 10.0
elo_max = 23.0

[fm]
# Best configuration from a sweep against season53. Unlike the original FM,
# this one is genuinely sensitive to k and weight decay, so these were chosen
# rather than inherited.
model        = "ffm"     # antisymmetric field-aware; "classic" for the original
k            = 64
lr           = 1e-3
weight_decay = 1e-5
batch_size   = 8192
max_epochs   = 40
patience     = 5
