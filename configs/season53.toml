# A full-season run: everything above elo 10, the whole published season.
name = "season53"
seed = 20260903
output_dir = "runs"

[data]
season  = "season53"
repo_id = "EliF77/brawlstars-ranked"
elo_min = 10.0
elo_max = 23.0

[fm]
# Best configuration from a sweep against season53. Unlike the original FM,
# this one is genuinely sensitive to k and weight decay, so these were chosen
# rather than inherited.
model        = "ffm"     # antisymmetric field-aware; "classic" for the original
k            = 64
lr           = 1e-3
weight_decay = 1e-5
batch_size   = 8192
max_epochs   = 40
patience     = 5

[selfplay]
# One iteration is the useful one: measured, iterations 2 and 3 scored 0.498 and
# 0.501 against the policy from iteration 1 — coin flips. Distillation captures
# the search in one pass, and the evaluator it learns from does not change.
n_iterations        = 1
n_games_per_iter    = 150
n_sims_later        = 2000
n_eval_games        = 200
n_sims_eval         = 1000
promotion_threshold = 0.525
n_workers           = 1
resume              = true
