# A real self-play loop, sized from measured throughput (~0.9 s/game at 2000
# sims). Three iterations of 150 games is roughly 20 minutes on one core.
name = "selfplay53"
seed = 20260903
output_dir = "runs"

[data]
season  = "season53"
elo_min = 10.0
elo_max = 23.0

[fm]
model = "ffm"
k = 64
lr = 1e-3
weight_decay = 1e-5
batch_size = 8192
max_epochs = 40
patience = 5

[selfplay]
# One iteration is the useful one: measured, iterations 2 and 3 scored 0.498
# and 0.501 against the policy from iteration 1 — coin flips. Distillation
# captures the search in one pass and the search does not change afterwards.
n_iterations        = 1
n_games_per_iter    = 150
n_sims_later        = 2000
n_eval_games        = 200   # 60 leaves promotion within noise of the threshold
n_sims_eval         = 1000
promotion_threshold = 0.525
n_workers           = 1
resume              = true
