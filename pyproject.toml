[project]
name = "logr-mcts"
version = "0.1.0"
description = "Draft recommendation for Brawl Stars ranked: a calibrated factorization-machine evaluator inside Monte Carlo tree search, trained by self-play"
requires-python = ">=3.13"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Eli Fried", email = "elixf7@gmail.com" }]
keywords = ["machine-learning", "monte-carlo-tree-search", "self-play", "factorization-machines", "brawl-stars"]
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.10.0",
]
